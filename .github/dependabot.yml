version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      dev:
        dependency-type: development
    ignore:
      # VitePress 2 is a prerelease that this package pins exactly and ships
      # into every generated site. Bumping it is a deliberate release, made
      # after rebuilding the runtime templates against it.
      - dependency-name: vitepress

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
