# Publishes to npm and creates the `v*` GitHub Release when `main` advances
# `package.json` to an unreleased version. A lightweight check job gates the
# `release` environment so ordinary pushes to `main` finish in seconds without
# re-running the test ladder. Actions are pinned by SHA because `publish` holds
# `id-token: write`.
name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      dry_run:
        description: Validate and build without publishing or creating a release
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
      pull-requests: write
    outputs:
      should_release: ${{ steps.release.outputs.should_release }}
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      prerelease: ${{ steps.release.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.MY_RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Release PR or Release
        id: release
        uses: kohltastrophe/release@v1.0.0
        with:
          token: ${{ secrets.MY_RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          dry-run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
          wait-for-ci: ci.yml

      - name: Upload release notes
        if: steps.release.outputs.should_release == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-notes
          path: ${{ steps.release.outputs.notes_file }}

  publish:
    needs: check
    if: needs.check.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write # create the tag and GitHub Release
      id-token: write # npm provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"

      - name: Download release notes
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-notes
          path: .

      - run: bun install --frozen-lockfile

      - name: Generate src/generated
        run: bun run generate

      - name: Build
        run: bun run build

      # Same guard as CI: drive the CLI out of an extracted tarball with
      # production deps only, so a packaging gap fails before publish, not after.
      - name: Packed tarball smoke test
        run: |
          set -euo pipefail
          tarball="$(npm pack --ignore-scripts | tail -n1)"
          smoke="$(mktemp -d)"
          tar -xzf "$tarball" -C "$smoke"
          pkg="$smoke/package"
          npm install --omit=dev --ignore-scripts --no-audit --no-fund --prefix "$pkg"
          proj="$smoke/project"
          cp -r test/fixtures/sample-project "$proj"
          cd "$proj"
          node "$pkg/dist/cli.js" init . --title Smoke --force
          node "$pkg/dist/cli.js" build . --emit-only
          ls .luaudocs/api/*.md
          ls .github/workflows/docs.yml

      # --ignore-scripts: publish the dist/ and src/generated/ the steps above
      # tested, not a fresh prepare rebuild nothing exercised.
      # Both steps below are idempotent, so a failed run can simply be re-run:
      # a version already on the registry skips the publish, and an existing
      # release is edited rather than created again.
      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          RELEASE_VERSION: ${{ needs.check.outputs.version }}
        run: |
          set -euo pipefail
          if npm view "luaudocs@$RELEASE_VERSION" version >/dev/null 2>&1; then
            echo "luaudocs@$RELEASE_VERSION is already on the registry; skipping publish"
          else
            npm publish --ignore-scripts
          fi

      - name: GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.check.outputs.tag }}
          NOTES_FILE: release-notes.md
          PRERELEASE: ${{ needs.check.outputs.prerelease }}
        run: |
          set -euo pipefail
          flags=(--title "$RELEASE_TAG" --notes-file "$NOTES_FILE")
          if [ "$PRERELEASE" = "true" ]; then
            flags+=(--prerelease)
          fi
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" \
              --title "$RELEASE_TAG" \
              --notes-file "$NOTES_FILE"
          elif git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" "${flags[@]}"
          else
            gh release create "$RELEASE_TAG" \
              --target "$GITHUB_SHA" \
              "${flags[@]}"
          fi
