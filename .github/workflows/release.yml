# Publishes to npm and creates the `v*` GitHub Release when `main` advances
# `package.json` to an unreleased version. A lightweight check job gates the
# `release` environment so ordinary pushes to `main` finish in seconds without
# re-running the test ladder. Actions are pinned by SHA because `publish` holds
# `id-token: write`.
name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      dry_run:
        description: Validate and build without publishing or creating a release
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
      pull-requests: write
    outputs:
      should_release: ${{ steps.release.outputs.should_release }}
      should_build: ${{ steps.release.outputs.should_build }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Release PR or Release
        id: release
        uses: kohltastrophe/release@v1
        with:
          wait-for-ci: ci.yml

  publish:
    needs: check
    if: needs.check.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write # create the tag and GitHub Release
      id-token: write # npm provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.12"
          registry-url: "https://registry.npmjs.org"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"

      - name: Cache the pinned Lute
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/luaudocs
          key: lute-${{ runner.os }}-${{ hashFiles('src/lute.ts') }}

      - run: bun install --frozen-lockfile

      - name: Generate src/generated
        run: bun run generate

      - name: Build
        run: bun run build

      # Same guard as CI: drive the CLI out of an extracted tarball with
      # production deps only, so a packaging gap fails before publish, not after.
      - name: Packed tarball smoke test
        run: bun run test:pack

      # --ignore-scripts: publish the dist/ and src/generated/ the steps above
      # tested, not a fresh prepare rebuild nothing exercised.
      # Both steps below are idempotent, so a failed run can simply be re-run:
      # a version already on the registry skips the publish, and an existing
      # release is edited rather than created again.
      - name: Publish to npm
        if: needs.check.outputs.should_release == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          RELEASE_VERSION: ${{ needs.check.outputs.version }}
        run: |
          set -euo pipefail
          if npm view "luaudocs@$RELEASE_VERSION" version >/dev/null 2>&1; then
            echo "luaudocs@$RELEASE_VERSION is already on the registry; skipping publish"
          else
            npm publish --ignore-scripts
          fi

      - name: GitHub Release
        if: needs.check.outputs.should_release == 'true'
        uses: kohltastrophe/release@v1
        with:
          mode: publish
