title = "LuauDocs"
description = "Documentation generator for Luau."

# Document examples/Flux as the live example API reference. The guides embed
# real entries generated from this build.
[source]
entries = ["examples/Flux"]

[[site.nav]]
text = "Guide"
link = "/guide/getting-started"
activeMatch = "^/guide/"
[[site.nav]]
text = "Example API"
link = "/api/"
activeMatch = "^/api/"
[[site.nav]]
text = "Changelog"
link = "/changelog"

[repo]
url = "https://github.com/kohltastrophe/luaudocs"

[site]
logo = "/logo.svg"
favicon = "/logo.svg"

[docs]
url = "https://luaudocs.kohl.gg"
# Publish model.json so external sites can link into Flux's types.
model = true
