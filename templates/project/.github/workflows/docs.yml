# Builds the docs and deploys them to GitHub Pages on every push to the branch
# below (your repository's default branch when this file was scaffolded).
# Set the repository's Pages source to "GitHub Actions" and this workflow runs
# as-is: Node is the only tool to install, and configure-pages reports the base
# URL so project-pages paths and custom domains resolve without a [docs] url.
name: Docs
on:
  push:
    branches: "@BRANCH@"
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with: { node-version: "@NODE_MAJOR@" }
      - id: luaudocs
        run: echo "version=$(npm view luaudocs version)" >> "$GITHUB_OUTPUT"
      # Cache the npm cache, the generated site's node_modules, and the Lute
      # binary downloaded into ~/.cache/luaudocs across runs, keyed on the
      # resolved luaudocs release so a new release refreshes the cache.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            ~/.cache/luaudocs
            @DOCS_DIR@/node_modules
          key: ${{ runner.os }}-luaudocs-${{ steps.luaudocs.outputs.version }}
      - id: pages
        uses: actions/configure-pages@v6
      - run: npx luaudocs@latest build --url "${{ steps.pages.outputs.base_url }}"
      - uses: actions/upload-pages-artifact@v5
        with: { path: "@DOCS_DIR@/.vitepress/dist" }
      - id: deployment
        uses: actions/deploy-pages@v5
